name: haraj_yemen
description: حراج اليمن - سوق الإعلانات المجانية
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0
  dart_jsonwebtoken: ^2.8.0

  # UI & Fonts
  google_fonts: ^6.1.0
  intl: ^0.20.2

  # Image
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  carousel_slider: ^5.0.0

  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # Utils
  url_launcher: ^6.2.4
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  path_provider: ^2.1.2
  http: ^1.2.0
  mailer: ^6.1.0
  crypto: ^3.0.3
  shimmer: ^3.0.0
  timeago: ^3.6.1
  pin_code_fields: ^8.0.1
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1a3a6e"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/data/
